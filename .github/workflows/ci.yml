name: Checks
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    if: github.event.repository.private == false
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:language
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  project-browser:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm exec -- playwright-core install chromium
      - run: npm run build
      - run: node dist/scripts/smoke-projects-browser.js
      - name: Print browser result in the run log
        if: always()
        shell: pwsh
        run: |
          foreach ($report in @('artifacts/project-browser/report.json', 'artifacts/project-browser/failure.json')) {
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          }
  codex-transport:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      # Fresh runner profile: no login, tokens, existing App sessions or model call.
      - run: npm run codex:install
      - run: npm run codex:status

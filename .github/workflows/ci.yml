name: Phase 0 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Export dependency lockfile for bootstrap
        run: node -e "console.log('LOCKFILE_START'); console.log(require('node:fs').readFileSync('package-lock.json', 'utf8')); console.log('LOCKFILE_END')"
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

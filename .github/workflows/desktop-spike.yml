name: Windows desktop feasibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Install pinned desktop development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Electron first-run binary initialization after a clean install
        run: node -e "const fs = require('node:fs'); if (fs.existsSync('node_modules/electron/dist/electron.exe')) throw new Error('Expected a clean install without the binary'); const executable = require('electron'); if (!fs.existsSync(executable)) throw new Error('Electron binary is missing after first-run initialization'); console.log('Electron first-run initialization succeeded.');"
      - name: Record dependency audit diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          npm audit --json | Set-Content -LiteralPath artifacts/dependency-audit.json -Encoding utf8
          $auditExitCode = $LASTEXITCODE
          if ($auditExitCode -gt 1) { throw 'Dependency audit could not complete' }
          $audit = Get-Content -LiteralPath artifacts/dependency-audit.json -Raw | ConvertFrom-Json
          if (-not $audit.metadata -or -not ($audit.PSObject.Properties.Name -contains 'vulnerabilities')) { throw 'Dependency audit returned no usable vulnerability report' }
          Write-Output 'AUDIT_START'
          Get-Content -LiteralPath artifacts/dependency-audit.json -Raw
          Write-Output 'AUDIT_END'
          exit 0
      - name: Verify bundled Node and SQLite compatibility
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: .\node_modules\electron\dist\electron.exe -e "const {DatabaseSync}=require('node:sqlite'); const db=new DatabaseSync(':memory:'); console.log(JSON.stringify({versions:process.versions,sqlite:db.prepare('select sqlite_version() version').get()})); db.close();"
      - run: npm run check:language
      - run: npm run typecheck
      - run: npm run package:windows
      - run: npm test
      - name: Install the unsigned experiment in a disposable directory
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter 'FocusFlow-Phase0-*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          $installationDirectory = Join-Path $env:RUNNER_TEMP 'focusflow-phase0-installed'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installationDirectory") -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited with code $($result.ExitCode)" }
          node dist/scripts/smoke-desktop.js (Join-Path $installationDirectory 'FocusFlow-Phase0.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-experiment
          path: |
            release/FocusFlow-Phase0-*-x64.exe
            artifacts/desktop/
            artifacts/dependency-audit.json
          if-no-files-found: ignore
          retention-days: 14

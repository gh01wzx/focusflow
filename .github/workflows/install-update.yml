name: Windows installer replacement experiment
on:
  pull_request:
    paths:
      - '.github/workflows/install-update.yml'
      - 'scripts/smoke-install-update.ts'
      - 'docs/RELEASE_ROUTE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-install-update:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Initialize pinned Electron
        run: node -e "const fs=require('node:fs');const exe=require('electron');if(!fs.existsSync(exe))throw new Error('Missing runtime')"
      - run: npm run package:windows
      - name: Build candidate with the same code and a test-only version
        run: npm exec -- electron-builder --win --x64 --publish never --config electron-builder.json --config.extraMetadata.version=0.1.0-alpha.4 --config.directories.output=.phase0/update-candidate
      - name: Install, replace, recover separately and return to baseline
        timeout-minutes: 8
        shell: pwsh
        run: |
          $baseline = Get-Item -LiteralPath release/FocusFlow-0.1.0-alpha.3-x64.exe
          $candidate = Get-Item -LiteralPath .phase0/update-candidate/FocusFlow-0.1.0-alpha.4-x64.exe
          node dist/scripts/smoke-install-update.js $baseline.FullName $candidate.FullName
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-replacement-experiment
          path: artifacts/install-update/
          retention-days: 14

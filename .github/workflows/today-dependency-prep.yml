name: Prepare pinned Today dependencies
on: [push]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact react@19.3.1 react-dom@19.3.1
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact '@types/react@19' '@types/react-dom@19' esbuild@latest
      - name: Emit pinned manifests
        run: |
          echo PREP_PACKAGE_START
          cat package.json
          echo PREP_PACKAGE_END
          echo PREP_LOCK_START
          cat package-lock.json
          echo PREP_LOCK_END
